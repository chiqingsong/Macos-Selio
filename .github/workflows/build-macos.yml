name: Build macOS

on:
  push:
    branches:
      - main
      - codex/**
  pull_request:

jobs:
  build-and-test:
    runs-on: macos-15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Build and test
        run: |
          xcodebuild \
            -project ChecklistApp/ChecklistApp.xcodeproj \
            -scheme ChecklistApp \
            -destination 'platform=macOS' \
            test

      - name: Build app bundle
        run: |
          xcodebuild \
            -project ChecklistApp/ChecklistApp.xcodeproj \
            -scheme ChecklistApp \
            -configuration Debug \
            -derivedDataPath DerivedData \
            build

      - name: Zip app bundle
        run: |
          ditto -c -k --sequesterRsrc --keepParent \
            DerivedData/Build/Products/Debug/ChecklistApp.app \
            ChecklistApp.app.zip

      - name: Upload app artifact
        uses: actions/upload-artifact@v4
        with:
          name: ChecklistApp-macOS-app-zip
          path: ChecklistApp.app.zip
